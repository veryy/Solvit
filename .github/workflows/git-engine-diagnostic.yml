name: Android Git engine compatibility
on:
  push:
    branches: [feat/workspace-git, feat/workspace-github]
    paths: ['core/**', 'git-android/**', 'buildSrc/**', 'settings.gradle.kts', 'scripts/git-http-fixture.py', '.github/workflows/git-engine-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  git-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare actual TLS Git backend fixture
        run: |
          mkdir -p "$RUNNER_TEMP/solvit-git-http" git-android/src/androidTest/assets
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout "$RUNNER_TEMP/solvit-git-http/key.pem" -out "$RUNNER_TEMP/solvit-git-http/cert.pem" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/solvit-git-http/key.pem"
          cp "$RUNNER_TEMP/solvit-git-http/cert.pem" git-android/src/androidTest/assets/git-fixture.crt
          nohup python3 scripts/git-http-fixture.py --root "$RUNNER_TEMP/solvit-git-http/repositories" --cert "$RUNNER_TEMP/solvit-git-http/cert.pem" --key "$RUNNER_TEMP/solvit-git-http/key.pem" > "$RUNNER_TEMP/solvit-git-http/server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert "$RUNNER_TEMP/solvit-git-http/cert.pem" https://localhost:19443/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Prepare actual Android Git test APKs
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          ./gradlew :core:test :git-android:assembleDebug :git-android:assembleDebugAndroidTest --stacktrace
      - name: Install emulator image with bounded download retries
        run: |
          image='system-images;android-${{ matrix.api }};default;x86_64'
          for attempt in 1 2 3; do
            if sdkmanager "$image"; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: adb reverse tcp:19443 tcp:19443 && ./gradlew :git-android:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-engine-android-${{ matrix.api }}
          path: |
            git-android/build/reports/androidTests/
            git-android/build/outputs/androidTest-results/
