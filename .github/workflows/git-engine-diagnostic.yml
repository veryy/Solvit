name: Android Git engine compatibility
on:
  push:
    branches: [feat/workspace-git]
    paths: ['git-android/**', 'buildSrc/**', 'settings.gradle.kts', '.github/workflows/git-engine-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare actual Android Git test APKs
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew :git-android:assembleDebug :git-android:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :git-android:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-engine-android-${{ matrix.api }}
          path: |
            git-android/build/reports/androidTests/
            git-android/build/outputs/androidTest-results/
