name: TypeScript plugins
on:
  workflow_call:
  push:
    paths: ['plugin-sdk/**', 'plugin-examples/**', 'builtin-plugins/**', 'market-server/packages/**', '.github/workflows/plugins.yml']
  pull_request:
    paths: ['plugin-sdk/**', 'plugin-examples/**', 'builtin-plugins/**', 'market-server/packages/**', '.github/workflows/plugins.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin-sdk/package-lock.json
      - run: npm ci
        working-directory: plugin-sdk
      - run: npm run build:builtins
        working-directory: plugin-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: solvit-builtin-plugins
          path: market-server/packages/*.solvit.json
      - run: npm run typecheck && npm test
        working-directory: plugin-sdk
      - run: npm test
        working-directory: market-server
      - run: |
          git diff --exit-code -- market-server/packages plugin-market/src/main/assets/builtin-plugins
          test -z "$(git ls-files --others --exclude-standard -- market-server/packages plugin-market/src/main/assets/builtin-plugins)"
      - name: Verify no-configuration public web search
        run: node scripts/check-live-web-search.mjs
        working-directory: plugin-sdk
      - name: Verify live HTTPS MCP demo
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-live-mcp.mjs
        working-directory: plugin-sdk
        env:
          SOLVIT_MCP_ENDPOINT: https://solvit.207.57.126.73.sslip.io/mcp-demo
      - name: Verify live Skills marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-live-skills.mjs
        working-directory: plugin-sdk
