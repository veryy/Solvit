name: Android page diagnostic
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Android run with identical production sources and APK/native artifacts
        required: true
        default: '38624928283'
      test_case:
        description: Existing full device scenario to repeat, stopping at first failure
        type: choice
        default: workspace-editor
        options: [plugin-browser-bottom, plugin-browser, first-use, mcp-page, attachment-preview, pdf-chat, terminal-tabs, chat-drafts-sequence, chat-drafts, environment-ui, history-search, memory-labels, plugin-page-feedback, workspace-forms, workspace-editor, workspace-startup, workspace-startup-stress, workspace-startup-sequence, compose-lifecycle-dispatch, plugin-document-lifecycle, plugin-resume, chat-interaction, chat-interaction-large-text, settings-theme, language-settings, file-imports, chat-branches, queued-ui-scroll, queued-ui-follow-up, plugin-page-ready, workspace-user-lifecycle, workspace-user-lifecycle-stress, webview-plugin-host-control, plugin-native-entry]
      repetitions:
        description: Number of repetitions (1 through 8)
        type: string
        default: '8'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLVIT_DIAGNOSTIC_CASE: ${{ inputs.test_case || 'workspace-editor' }}
      SOLVIT_DIAGNOSTIC_REPETITIONS: ${{ inputs.repetitions || '8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        with:
          script: |
            const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.APK_RUN_ID)})).data;
            // A completed build has finalized its APK/native artifacts even while
            // the independent UI suite is running. Never use an unfinished build.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: run.id, per_page: 100});
            if (!jobs.some(job => job.name === 'build' && job.status === 'completed' && job.conclusion === 'success')) {
              throw new Error('APK source build must have completed successfully');
            }
            const {execFileSync} = require('child_process');
            const files = execFileSync('git', ['diff', '--name-only', run.head_sha, 'HEAD']).toString().trim().split('\n').filter(Boolean);
            const allowed = p => p.startsWith('app/src/androidTest/') || p.startsWith('docs/') || p.startsWith('.github/workflows/') || p.startsWith('scripts/') || ['README.md','README.en.md','plugin-sdk/README.md'].includes(p);
            if (files.some(p => !allowed(p))) throw new Error('Production source differs from APK: ' + files.filter(p => !allowed(p)).join(', '));
            console.log('Production APK source: ' + run.head_sha);
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: solvit-debug-apk
          path: diagnostic-apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: solvit-linux-native
          path: linux-android/src/main/jniLibs/
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Restore stable instrumentation signing identity
        env:
          SOLVIT_KEYSTORE: ${{ secrets.SOLVIT_DEBUG_KEYSTORE }}
        run: |
          test -n "$SOLVIT_KEYSTORE"
          mkdir -p .signing
          printf '%s' "$SOLVIT_KEYSTORE" | base64 --decode > .signing/debug.keystore
          chmod 600 .signing/debug.keystore
      - name: Build instrumented test APK remotely
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          ./gradlew :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          script: bash scripts/verify-workspace-ime-diagnostic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-page-diagnostic
          path: ui-screenshots/
