name: Native stdio transport diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipes:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile native transport and instrumentation
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          ./gradlew :system-runtime:test :linux-runtime:test :linux-android:compileDebugKotlin :terminal-android:assembleDebug :terminal-android:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :terminal-android:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.solvit.terminal.StdioConnectionTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdio-transport-api${{ matrix.api }}
          path: |
            terminal-android/build/reports/androidTests/
            terminal-android/build/outputs/androidTest-results/
            linux-runtime/build/test-results/test/
            system-runtime/build/test-results/test/
