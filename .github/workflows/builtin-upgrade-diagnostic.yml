name: Builtin upgrade diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrades:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Verify actual bundled packages and persisted upgrade state
        run: ./gradlew :plugin-market:testDebugUnitTest --tests dev.solvit.market.BuiltinMemoryTest --tests dev.solvit.market.BuiltinMcpUpgradeTest --tests dev.solvit.market.WorkspaceInstructionsHookTest --tests dev.solvit.market.BuiltinTerminalUpgradeTest --continue --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builtin-upgrade-diagnostic
          path: |
            plugin-market/build/test-results/testDebugUnitTest/
            plugin-market/build/reports/tests/
