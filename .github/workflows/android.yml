name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore stable APK signing key
        env:
          SOLVIT_KEYSTORE: ${{ secrets.SOLVIT_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$SOLVIT_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SOLVIT_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'Missing stable APK signing key'
            exit 1
          fi
      - name: Tests, lint and APK
        run: ./gradlew :core:test :provider-openai:test :chat-runtime:test :release-updates:test :plugin-runtime:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: solvit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/test/
            app/build/reports/lint-results-debug.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: solvit-debug-apk
          path: apk
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const body = `APK 由 GitHub Actions 构建，测试与 Lint 通过。\n\n构建：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n下载 solvit-debug.apk 安装。0.1.1 起使用固定签名；早期 0.1.0 的临时签名不能覆盖安装。尚未进行真机和真实模型验证。`;
            const notesPath = `docs/release-${tag.slice(1)}.md`;
            const notes = fs.existsSync(notesPath) ? fs.readFileSync(notesPath, 'utf8') : '';
            const releaseBody = notes ? `${notes}\n\n${body}` : body;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...context.repo, tag_name: tag,
                name: `Solvit ${tag}`, body: releaseBody, draft: true, prerelease: false})).data;
            }
            const bytes = fs.readFileSync('apk/app-debug.apk');
            const assets = (await github.rest.repos.listReleaseAssets({...context.repo, release_id: release.id})).data;
            if (assets.some(asset => asset.name === 'solvit-debug.apk')) {
              throw new Error('APK asset already exists; refusing to replace a published binary');
            }
            await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id,
              name: 'solvit-debug.apk', data: bytes,
              headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': bytes.length}});
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false, make_latest: 'true'});
