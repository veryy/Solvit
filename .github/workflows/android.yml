name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore stable APK signing key
        env:
          SOLVIT_KEYSTORE: ${{ secrets.SOLVIT_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$SOLVIT_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SOLVIT_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'Missing stable APK signing key'
            exit 1
          fi
      - name: Tests, lint and APK
        run: ./gradlew :core:test :provider-openai:test :chat-runtime:test :release-updates:test :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: solvit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/test/
            app/build/reports/lint-results-debug.html
