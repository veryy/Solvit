name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_diagnostic:
        description: Additional diagnostic loop before the complete UI suite
        type: choice
        default: none
        options:
          - none
          - memory-filter-stress
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore stable APK signing key
        env:
          SOLVIT_KEYSTORE: ${{ secrets.SOLVIT_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$SOLVIT_KEYSTORE" ]; then
            mkdir -p .signing
            printf '%s' "$SOLVIT_KEYSTORE" | base64 --decode > .signing/debug.keystore
            chmod 600 .signing/debug.keystore
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'Missing stable APK signing key'
            exit 1
          fi
      - name: Tests, lint and APK
        run: ./gradlew :core:test :system-runtime:test :workspace-android:testDebugUnitTest :web-android:testDebugUnitTest :provider-http:test :provider-openai:test :provider-anthropic:test :chat-runtime:test :release-updates:test :plugin-runtime:testDebugUnitTest :storage-sqlite:testDebugUnitTest :plugin-market:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :terminal-android:assembleDebugAndroidTest :web-android:assembleDebugAndroidTest --stacktrace
      - name: Verify published APK signing identity
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > apk-signing.txt
          cat apk-signing.txt
          grep -F 'Signer #1 certificate SHA-256 digest: f076abf86de542063f8655abf9021cb88b642ab9b664cafc46c0f16b4303bcc3' apk-signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: solvit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/test/
            **/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
  verify-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOLVIT_UI_DIAGNOSTIC: ${{ inputs.ui_diagnostic || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable key for in-place upgrade verification
        env:
          SOLVIT_KEYSTORE: ${{ secrets.SOLVIT_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$SOLVIT_KEYSTORE" ]; then
            mkdir -p .signing
            printf '%s' "$SOLVIT_KEYSTORE" | base64 --decode > .signing/debug.keystore
            chmod 600 .signing/debug.keystore
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'Missing stable APK signing key'
            exit 1
          fi
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare UI APKs outside emulator
        timeout-minutes: 15
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :terminal-android:assembleDebug :terminal-android:assembleDebugAndroidTest :web-android:assembleDebugAndroidTest --stacktrace
      - name: Download previous signed release
        if: github.event_name != 'pull_request'
        timeout-minutes: 4
        run: |
          mkdir -p ui-screenshots
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 180 https://github.com/veryy/Solvit/releases/download/v0.7.0/solvit-debug.apk --output ui-screenshots/previous.apk
          printf '%s\n' '88684ed71af4c390217d4ee6f58e3a169d513e812744eb97af34318d71d5d631  ui-screenshots/previous.apk' | sha256sum --check
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 18
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          script: bash scripts/verify-android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            web-android/build/reports/androidTests/
            web-android/build/outputs/androidTest-results/
            terminal-android/build/reports/androidTests/
            terminal-android/build/outputs/androidTest-results/
            ui-screenshots/
  verify-plugins:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/plugins.yml
  verify-search:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/search-quality.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-ui, verify-plugins, verify-search]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: solvit-debug-apk
          path: apk
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const body = `APK 由 GitHub Actions 构建，测试、Lint 和签名指纹检查通过。\n\n构建：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n下载 solvit-debug.apk 安装。0.7.0 起明确使用固定签名；0.6.0 及之前的发布包证书不同，不能覆盖安装，请先保存旧配置。正常覆盖更新保留数据，卸载会删除数据。尚未进行真机及真实模型与 Android 工具的完整联动验证。`;
            const notesPath = `docs/release-${tag.slice(1)}.md`;
            const notes = fs.existsSync(notesPath) ? fs.readFileSync(notesPath, 'utf8') : '';
            const releaseBody = notes ? `${notes}\n\n${body}` : body;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...context.repo, tag_name: tag,
                name: `Solvit ${tag}`, body: releaseBody, draft: true, prerelease: false})).data;
            }
            const bytes = fs.readFileSync('apk/app-debug.apk');
            const assets = (await github.rest.repos.listReleaseAssets({...context.repo, release_id: release.id})).data;
            if (assets.some(asset => asset.name === 'solvit-debug.apk')) {
              throw new Error('APK asset already exists; refusing to replace a published binary');
            }
            await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id,
              name: 'solvit-debug.apk', data: bytes,
              headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': bytes.length}});
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false, make_latest: 'true'});
