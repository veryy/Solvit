name: Search release diagnosis
on:
  workflow_dispatch:
  push:
    branches: [diagnose/search-release]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.51.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: node scripts/diagnose-public-search.mjs
        env:
          SOLVIT_BROWSER_PACKAGE: ${{ runner.temp }}/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-release-diagnosis
          path: search-release-diagnosis.json
