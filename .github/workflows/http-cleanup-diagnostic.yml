name: HTTP response ownership diagnostic
on:
  workflow_dispatch:
  push:
    branches: [feat/http-response-cleanup]
    paths: ['provider-http/**', '.github/workflows/http-cleanup-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: http-cleanup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :provider-http:test --tests dev.solvit.http.HttpResponseOwnershipTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-response-ownership
          path: |
            provider-http/build/test-results/test/
            provider-http/build/reports/tests/
