name: Plugin document contract diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate document controls and existing page contracts
        run: ./gradlew :core:test :plugin-runtime:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-document-contract-reports
          path: |
            core/build/test-results/test/
            plugin-runtime/build/test-results/testDebugUnitTest/
