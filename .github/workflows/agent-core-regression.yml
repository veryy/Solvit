name: Agent core regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tool-results:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Observe both registry and complete Agent result boundaries
        run: ./gradlew :core:test --tests dev.solvit.core.ToolResultLimitTest :chat-runtime:test --tests dev.solvit.chat.ToolAgentRuntimeTest --continue --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-core-regression-reports
          path: |
            core/build/test-results/test/
            chat-runtime/build/test-results/test/
            core/build/reports/tests/
            chat-runtime/build/reports/tests/
