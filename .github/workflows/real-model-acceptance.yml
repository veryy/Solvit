name: Real model acceptance
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS API base address (no key or query parameters)
        required: true
        type: string
      model:
        description: Actual model name
        required: true
        type: string
      provider:
        description: Existing provider adapter
        type: choice
        default: openai-compatible
        options: [openai-compatible, anthropic]
permissions:
  contents: read
concurrency:
  group: real-model-acceptance
  cancel-in-progress: false
jobs:
  actual-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require actual model credential
        env:
          SOLVIT_MODEL_API_KEY: ${{ secrets.SOLVIT_MODEL_API_KEY }}
        run: |
          if [ -z "$SOLVIT_MODEL_API_KEY" ]; then
            echo 'Missing SOLVIT_MODEL_API_KEY; real-model acceptance cannot run'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable signing key
        env:
          SOLVIT_KEYSTORE: ${{ secrets.SOLVIT_DEBUG_KEYSTORE }}
        run: |
          test -n "$SOLVIT_KEYSTORE"
          mkdir -p .signing
          printf '%s' "$SOLVIT_KEYSTORE" | base64 --decode > .signing/debug.keystore
          chmod 600 .signing/debug.keystore
      - name: Build actual app and instrumentation
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > apk-signing.txt
          grep -F 'Signer #1 certificate SHA-256 digest: f076abf86de542063f8655abf9021cb88b642ab9b664cafc46c0f16b4303bcc3' apk-signing.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 24
        env:
          SOLVIT_MODEL_API_KEY: ${{ secrets.SOLVIT_MODEL_API_KEY }}
          SOLVIT_MODEL_BASE_URL: ${{ inputs.base_url }}
          SOLVIT_MODEL_NAME: ${{ inputs.model }}
          SOLVIT_MODEL_PROVIDER: ${{ inputs.provider }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          script: python3 scripts/verify-real-model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-acceptance-reports
          path: real-model-reports/
