name: Linux environment compatibility
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [feat/linux-environment]
    paths:
      - 'linux-probe/**'
      - 'linux-runtime/**'
      - 'linux-android/**'
      - 'system-runtime/**'
      - 'core/**'
      - 'terminal-android/**'
      - 'workspace-android/**'
      - 'scripts/build-android-proot.sh'
      - '.github/workflows/linux-environment.yml'
permissions:
  contents: read
concurrency:
  group: linux-environment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-proot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare SDK and native binaries from pinned source
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          bash scripts/build-android-proot.sh
      - name: Validate rootfs installation boundaries
        run: ./gradlew :linux-runtime:test :system-runtime:test :linux-android:assembleDebug --stacktrace
      - name: Prepare checksum-verified Ubuntu fixture
        run: |
          mkdir -p linux-probe/src/main/assets
          curl --fail --location --silent --show-error --retry 2 https://github.com/termux/proot-distro/releases/download/v4.17.3/ubuntu-noble-x86_64-pd-v4.17.3.tar.xz --output linux-probe/src/main/assets/ubuntu-x86_64.tar.xz
          printf '%s\n' '1680d024bf47d2414a36759af528ca3569a73b70682daa3d9693ba63157cb5a8  linux-probe/src/main/assets/ubuntu-x86_64.tar.xz' | sha256sum --check
      - name: Build compatibility probe APKs
        run: ./gradlew -PlinuxProbe=true :linux-probe:assembleDebug :linux-probe:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew -PlinuxProbe=true :linux-probe:connectedDebugAndroidTest --stacktrace
      - name: Verify actual runtime versions from device report
        run: |
          python3 - <<'PY_REPORT'
          from pathlib import Path
          import re
          root = Path('linux-probe/build/outputs/androidTest-results')
          logs = list(root.rglob('logcat-*UbuntuProbeTest*.txt'))
          assert logs, 'Missing Ubuntu device logcat'
          text = '\n'.join(p.read_text(errors='replace') for p in logs)
          match = re.search(r'RUNTIME_VERSIONS\|(Python 3\.[0-9]+\.[0-9]+[^|\r\n]*)\|(v[0-9]+\.[0-9]+\.[0-9]+)\|([0-9]+\.[0-9]+\.[0-9]+)', text)
          assert match, 'Actual Python/Node/npm versions were not captured'
          versions = '\n'.join(match.groups()) + '\n'
          Path('linux-probe/build/ubuntu-probe-versions.txt').write_text(versions)
          print('Ubuntu apt fixture:', versions)
          production = re.search(r'PRODUCTION_RUNTIME_VERSIONS\|(Python 3\.[0-9]+\.[0-9]+[^|\r\n]*)\|(v24\.21\.0)\|([0-9]+\.[0-9]+\.[0-9]+)', text)
          assert production, 'Production Node 24/Python/npm versions missing'
          assert 'JAVA_RUNTIME_VERIFIED|openjdk version "17.' in text, 'Production Java 17 execution missing'
          for runtime in ('python3', 'node'):
              assert f'STDIO_MCP_NATIVE|{runtime}|initialize|tools/list|tools/call|EOF|explicit-env|shared-workspace' in text, f'Actual {runtime} stdio MCP transport probe missing'
          for runtime in ('python', 'node'):
              assert f'STDIO_MCP_AGENT|{runtime}|QuickJS|host-authority|discovery|tool-call|follow-up|shared-file' in text, f'Actual JS/Agent {runtime} MCP probe missing'
              assert f'SKILLS_RESOURCES_AGENT|{runtime}|QuickJS|prepare|Ubuntu|failed-exit|repair|follow-up|shared-file|import-no-exec' in text, f'Actual JS/Agent {runtime} Skills execution missing'
          assert 'STDIO_MCP_AGENT|page-review|cancel|crash-no-replay|independent-node' in text, 'MCP page/cancel/crash evidence missing'
          assert 'STDIO_MCP_AGENT|disable|both-processes-reaped|chat-isolation' in text, 'MCP disable/chat isolation probe missing'
          Path('linux-probe/build/ubuntu-probe-production-versions.txt').write_text('\n'.join(production.groups()) + '\n')
          print('Production:', production.groups())
          PY_REPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-proot-compatibility
          path: |
            linux-probe/build/ubuntu-probe*
            linux-runtime/build/test-results/
            linux-probe/build-inputs/
            linux-probe/src/main/jniLibs/
            linux-android/src/main/jniLibs/
            linux-android/build/solvit-linux-sources.zip
            linux-probe/build/outputs/apk/
            linux-probe/build/outputs/androidTest-results/
            linux-probe/build/reports/androidTests/
