name: Linux environment compatibility
on:
  workflow_dispatch:
  push:
    branches: [feat/linux-environment]
    paths:
      - 'linux-probe/**'
      - 'linux-runtime/**'
      - 'scripts/build-android-proot.sh'
      - '.github/workflows/linux-environment.yml'
permissions:
  contents: read
concurrency:
  group: linux-environment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-proot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare SDK and native binaries from pinned source
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          bash scripts/build-android-proot.sh
      - name: Validate rootfs installation boundaries
        run: ./gradlew :linux-runtime:test --stacktrace
      - name: Build compatibility probe APKs
        run: ./gradlew -PlinuxProbe=true :linux-probe:assembleDebug :linux-probe:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew -PlinuxProbe=true :linux-probe:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-proot-compatibility
          path: |
            linux-runtime/build/test-results/
            linux-probe/build-inputs/
            linux-probe/src/main/jniLibs/
            linux-probe/build/outputs/apk/
            linux-probe/build/outputs/androidTest-results/
            linux-probe/build/reports/androidTests/
