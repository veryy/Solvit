<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="xterm.css"><link rel="stylesheet" href="style.css"></head><body>
<header><nav id="shells" aria-label="Shell"></nav><button id="add" aria-label="添加 Shell">＋</button><button id="manage" aria-label="终端管理">⋯</button></header>
<section id="welcome"><h2 id="title">交互终端</h2><p id="intro">同一终端保留目录和环境。终端在本应用身份下运行。</p><button id="open">打开终端</button></section>
<div id="terminals"></div><div id="status" role="status"></div>
<footer><div id="keys"><div class="key-row"><button data-key="\u0003">Ctrl-C</button><button data-key="\u0009">Tab</button><button id="toggle-keys" aria-expanded="false" aria-controls="extra-keys">更多按键</button></div>
<div id="extra-keys" class="key-row" hidden><button data-key="\u001b">Esc</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button></div></div>
<form id="input-form"><input id="command" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="命令或交互输入" placeholder="命令或交互输入"><button id="compact-interrupt" type="button" data-key="\u0003">Ctrl-C</button><button id="send" type="submit">发送</button></form></footer>
<dialog id="session-manager" aria-labelledby="manager-title"><div class="manager-heading"><h2 id="manager-title">终端管理</h2><button id="refresh" aria-label="刷新终端">↻</button></div>
<div id="manager-content"><section id="current-connection"><p id="current-session-label">当前连接</p><p id="current-session-name"></p><p id="current-session-state" role="status"></p></section><p id="no-sessions" hidden>当前聊天没有运行中的终端</p><div id="sessions"><label id="running-label" for="running">当前聊天的终端</label><select id="running"></select><button id="attach">连接已有终端</button></div>
<details id="manager-shortcuts"><summary id="manager-keys-label">更多按键</summary><div id="manager-keys" class="key-row"><button data-key="\u0003">Ctrl-C</button><button data-key="\u0009">Tab</button><button data-key="\u001b">Esc</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button></div>
</details><div class="manager-actions"><button id="close">关闭当前终端</button></div></div><button id="dismiss">返回终端</button></dialog>
<dialog id="new-shell"><form method="dialog"><label id="name-label" for="shell-name">Shell 名称</label><input id="shell-name" maxlength="80" required><div><button value="cancel" id="cancel">取消</button><button value="create" id="create">创建</button></div></form></dialog>
<script src="xterm.js"></script><script src="addon-fit.js"></script><script src="main.js"></script></body></html>
