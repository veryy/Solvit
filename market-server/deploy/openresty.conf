server {
    listen 80;
    server_name solvit.207.57.126.73.sslip.io;
    location /.well-known/acme-challenge/ { root /www/solvit-market-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name solvit.207.57.126.73.sslip.io;
    ssl_certificate /usr/local/openresty/nginx/conf/ssl/solvit-market/live/solvit.207.57.126.73.sslip.io/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/solvit-market/live/solvit.207.57.126.73.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
